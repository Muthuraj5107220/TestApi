name: test-api

on:
  push:
    branches: [ main ]
    pull_request:
      branches:
      - main
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@7.0.1
      - name: Setup .Net Core SDK
        uses: action@setup-dotnet@6.0.0
        with:
          dotnet-version: 10.0.*
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
