name: test-api-cd

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build TestApi/TestApi.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish TestApi/TestApi.csproj -c Release -o ./publish --no-build

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-api-artifact
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-api-artifact
          path: ./publish

      - name: Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'test-api-007'
          package: ./publish
          publish-profile: ${{ secrets.PUBLISH_PROFILE }}
